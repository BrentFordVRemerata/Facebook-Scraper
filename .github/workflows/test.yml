name: Offline Tests & Code Quality

on:
  push:
    branches: [ main, "maintenance/**" ]
  pull_request:
    branches: [ main ]

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax & Compilation Check
        run: |
          python -m py_compile main.py test_scraper.py src/*.py tests/*.py

      - name: Run Offline Unit Test Suite
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run Pipeline in Offline Fixture Mode
        run: |
          python main.py --offline
